[project]
name = "asr-bench"
version = "0.1.0"
description = "Generalized concurrency/latency/accuracy benchmark for OpenVoiceStream ASR (/asr/stream)"
requires-python = ">=3.9"
dependencies = [
    "websockets>=12.0",
    "numpy>=1.24",
    "soundfile>=0.12",
    "jiwer>=3.0",
]

[project.optional-dependencies]
corpus = ["pandas>=2.0", "pyarrow>=14.0"]

[tool.uv]
package = false
